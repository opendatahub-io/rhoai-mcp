name: check-others

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.repository == 'opendatahub-io/rhoai-mcp'
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.releases.outputs.releases }}
      latest-version: ${{ steps.releases.outputs.latest-version }}
      rhds-branches: ${{ steps.rhds-branches.outputs.branches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - name: Discover Quay releases
        id: releases
        env:
          QUAY_READONLY_USERNAME: ${{ secrets.QUAY_READONLY_USERNAME }}
          QUAY_READONLY_PASSWORD: ${{ secrets.QUAY_READONLY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$QUAY_READONLY_USERNAME" || -z "$QUAY_READONLY_PASSWORD" ]]; then
            echo '::error::QUAY_READONLY_USERNAME and QUAY_READONLY_PASSWORD secrets are required.'
            exit 1
          fi
          releases=$(
            printf '%s' "$QUAY_READONLY_PASSWORD" |
              oras repo tags --username "$QUAY_READONLY_USERNAME" --password-stdin \
                quay.io/rhoai/odh-rhoai-mcp-rhel9 |
              python3 .github/scripts/list_rhoai_releases.py
          )
          if [[ "$releases" == '[]' ]]; then
            echo '::error::No qualifying Quay release tags found.'
            exit 1
          fi
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          latest_version=$(jq -r 'last' <<< "$releases")
          echo "latest-version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Discover RHDS release branches
        id: rhds-branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=$(gh api --paginate repos/red-hat-data-services/rhoai-mcp/branches --jq '.[].name' | python3 .github/scripts/list_rhds_release_branches.py)
          if [[ "$branches" == '[]' ]]; then
            echo '::error::No RHDS release branches from 3.6-ea.2 onward found.'
            exit 1
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

      - name: Check Quay releases have RHDS branches
        env:
          RELEASES: ${{ steps.releases.outputs.releases }}
          BRANCHES: ${{ steps.rhds-branches.outputs.branches }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$BRANCHES" | jq -r '.[]' | python3 .github/scripts/list_rhds_release_branches.py --required-releases "$RELEASES" > /dev/null

  check-rhds-branch:
    needs: discover
    if: needs.discover.outputs.rhds-branches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.rhds-branches) }}
    name: check-rhds-branch (${{ matrix.branch }})
    steps:
      - name: Check RHDS image in params.env
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET \
            repos/red-hat-data-services/rhoai-mcp/contents/deploy/kustomize/base/params.env \
            -f ref="$BRANCH" \
            -H 'Accept: application/vnd.github.raw+json' > params.env

          expected="registry.redhat.io/rhoai/odh-rhoai-mcp-rhel9:v${BRANCH#rhoai-}"
          actual=$(sed -n 's/^RHOAI_MCP_IMAGE=//p' params.env)
          if [[ "$actual" != "$expected" ]]; then
            printf '::error::%s: expected RHOAI_MCP_IMAGE=%s; got %s\n' "$BRANCH" "$expected" "$actual"
            exit 1
          fi
          printf '%s: RHOAI_MCP_IMAGE=%s verified\n' "$BRANCH" "$actual"

  check-model-metadata-imageref:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: Check model metadata artifact URI
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_VERSION: ${{ needs.discover.outputs.latest-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LATEST_VERSION" ]]; then
            echo '::error::No qualifying Quay release tags found; cannot determine latest version.'
            exit 1
          fi
          gh api --method GET \
            repos/opendatahub-io/model-metadata-collection/contents/input/mcp_servers/redhat/rhoai-mcp-server.yaml \
            -H 'Accept: application/vnd.github.raw+json' > rhoai-mcp-server.yaml

          expected="oci://registry.redhat.io/rhoai/odh-rhoai-mcp-rhel9:v${LATEST_VERSION#rhoai-}"
          if ! EXPECTED_URI="$expected" yq -e '
            (.artifacts | length == 1) and (.artifacts[0].uri == strenv(EXPECTED_URI))
          ' rhoai-mcp-server.yaml > /dev/null; then
            actual=$(yq -o=json -I=0 '.artifacts' rhoai-mcp-server.yaml)
            printf '::error::Expected exactly one artifact with uri %s; got artifacts=%s\n' "$expected" "$actual"
            exit 1
          fi
          printf 'artifacts.uri verified: %s\n' "$expected"

  notify-failure:
    needs: [discover, check-rhds-branch, check-model-metadata-imageref]
    if: always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send job results to Slack
        env:
          MMORTARI_WORKFLOW_SLACK_WEBHOOK: ${{ secrets.MMORTARI_WORKFLOW_SLACK_WEBHOOK }}
          JOBS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MMORTARI_WORKFLOW_SLACK_WEBHOOK" ]]; then
            echo '::error::MMORTARI_WORKFLOW_SLACK_WEBHOOK is not available'
            exit 1
          fi
          payload=$(jq -n --argjson jobs "$JOBS" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg run_id "$GITHUB_RUN_ID" '
            {text: ("check-others failed\n<\($run_url)|Workflow run \($run_id)>\n" +
              ($jobs | to_entries | map("\(.key): \(.value.result)") | join("\n")))}
          ')
          if ! curl --fail --silent --max-time 30 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$MMORTARI_WORKFLOW_SLACK_WEBHOOK" > /dev/null 2>&1; then
            echo '::error::Failed to send Slack notification'
            exit 1
          fi
