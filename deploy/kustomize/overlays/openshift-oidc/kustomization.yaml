apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OIDC overlay for OpenShift deployments with multi-user authentication.
#
# Replaces the SA-as-actor ClusterRole with only the permissions needed to
# validate tokens and check user access. With the configured user-token
# strategy, resource RBAC is evaluated against the caller's bearer token,
# not the ServiceAccount's identity.

resources:
  - ../openshift
  # OpenShift service-serving CA bundle (see service-ca-configmap.yaml for details).
  - service-ca-configmap.yaml

patches:
  - target:
      kind: ClusterRole
      name: rhoai-mcp
    path: clusterrole-patch.yaml
  - target:
      kind: ConfigMap
      name: rhoai-mcp-config
    path: config-patch.yaml
  - target:
      kind: Route
      name: rhoai-mcp
    path: route-patch.yaml
  - target:
      kind: Deployment
      name: rhoai-mcp
    path: deployment-patch.yaml
  - target:
      kind: Service
      name: rhoai-mcp
    path: service-patch.yaml
